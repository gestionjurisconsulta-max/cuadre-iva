<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}{% endblock %}</title>
<style>
:root{
  --ground:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f5;
  --ink:#12161d; --muted:#5c6674; --faint:#8d97a5;
  --rule:#dde2e8; --rule-strong:#c3cbd6;
  --accent:#26456f; --accent-soft:#e6ecf4;
  --a3:#8a5512; --a3-soft:#f6ecdd;
  --bilky:#0f665c; --bilky-soft:#e0efec;
  --crit:#9c2530; --crit-soft:#f8e5e6;
  --band:#151b25; --band-ink:#e8ecf2; --band-muted:#95a2b4;
  --display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,ui-serif,Georgia,serif;
  --body:"Segoe UI","Helvetica Neue",system-ui,-apple-system,"Liberation Sans",Arial,sans-serif;
  --data:"Cascadia Mono",Consolas,"SF Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e1116; --surface:#161a21; --surface-2:#1c222b;
    --ink:#e4e8ee; --muted:#98a2b0; --faint:#6f7987;
    --rule:#262c35; --rule-strong:#39414d;
    --accent:#8ab0e0; --accent-soft:#1b2635;
    --a3:#d9a24e; --a3-soft:#2a2115;
    --bilky:#4dbaa9; --bilky-soft:#122622;
    --crit:#e2707a; --crit-soft:#2a171a;
    --band:#080a0e; --band-ink:#e4e8ee; --band-muted:#8b95a3;
  }
}
:root[data-theme="dark"]{
  --ground:#0e1116; --surface:#161a21; --surface-2:#1c222b;
  --ink:#e4e8ee; --muted:#98a2b0; --faint:#6f7987;
  --rule:#262c35; --rule-strong:#39414d;
  --accent:#8ab0e0; --accent-soft:#1b2635;
  --a3:#d9a24e; --a3-soft:#2a2115;
  --bilky:#4dbaa9; --bilky-soft:#122622;
  --crit:#e2707a; --crit-soft:#2a171a;
  --band:#080a0e; --band-ink:#e4e8ee; --band-muted:#8b95a3;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased}
.wrap{max-width:1160px; margin:0 auto; padding:0 32px}
@media (max-width:640px){ .wrap{padding:0 18px} }

header{background:var(--band); color:var(--band-ink); padding:44px 0 38px; border-bottom:1px solid var(--rule)}
.eyebrow{font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--band-muted); font-weight:600; margin:0 0 14px}
h1{font-family:var(--display); font-weight:600; font-size:clamp(29px,4.3vw,45px);
  line-height:1.08; letter-spacing:-.015em; margin:0 0 12px; text-wrap:balance; color:var(--band-ink)}
header p.lede{margin:0; color:var(--band-muted); font-size:15px; max-width:64ch}
header .files{display:flex; flex-wrap:wrap; gap:8px 10px; margin-top:22px;
  font-family:var(--data); font-size:11.5px; color:var(--band-muted)}
header .files span{border:1px solid rgba(255,255,255,.14); border-radius:3px; padding:4px 9px}

.verdict{background:var(--surface); border-bottom:1px solid var(--rule)}
.kpis{display:grid; grid-template-columns:repeat(4,1fr)}
@media (max-width:840px){ .kpis{grid-template-columns:repeat(2,1fr)} }
.kpi{padding:26px 24px 24px; border-right:1px solid var(--rule)}
.kpi:last-child{border-right:0}
@media (max-width:840px){ .kpi{border-bottom:1px solid var(--rule)} .kpi:nth-child(2n){border-right:0} }
.kpi .n{font-family:var(--data); font-size:clamp(21px,2.3vw,27px); font-weight:600;
  letter-spacing:-.025em; font-variant-numeric:tabular-nums; line-height:1.1; white-space:nowrap}
.kpi .l{font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.45}
.kpi.warn .n{color:var(--a3)} .kpi.good .n{color:var(--bilky)} .kpi.bad .n{color:var(--crit)}

section{padding:52px 0; border-bottom:1px solid var(--rule)}
section:last-of-type{border-bottom:0}
.sec-label{font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin:0 0 10px}
h2{font-family:var(--display); font-weight:600; font-size:clamp(22px,2.8vw,30px);
  letter-spacing:-.012em; line-height:1.18; margin:0 0 14px; text-wrap:balance}
h3{font-weight:650; font-size:15px; margin:34px 0 10px}
p{margin:0 0 14px; max-width:74ch}
.muted{color:var(--muted)} .small{font-size:13.5px}
.num{font-family:var(--data); font-variant-numeric:tabular-nums; font-size:.95em}
.pos{color:var(--a3)} .neg{color:var(--bilky)} .crit{color:var(--crit)}
ul{margin:0 0 14px; padding-left:20px; max-width:74ch} li{margin-bottom:7px}
li::marker{color:var(--faint)}
strong{font-weight:650}

.callout{background:var(--accent-soft); border-left:3px solid var(--accent);
  padding:16px 20px; margin:22px 0; border-radius:0 4px 4px 0}
.callout.bad{background:var(--crit-soft); border-left-color:var(--crit)}
.callout.ok{background:var(--bilky-soft); border-left-color:var(--bilky)}
.callout.warn{background:var(--a3-soft); border-left-color:var(--a3)}
.callout p{margin:0; max-width:none; font-size:14px}
.callout p + p{margin-top:9px}

.pill{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:3px 8px; border-radius:3px; white-space:nowrap; text-transform:uppercase}
.pill.a3{background:var(--a3-soft); color:var(--a3)}
.pill.bk{background:var(--bilky-soft); color:var(--bilky)}
.pill.cr{background:var(--crit-soft); color:var(--crit)}
.pill.ok{background:var(--surface-2); color:var(--muted)}
.pill.v-solo_a3{background:var(--crit-soft); color:var(--crit)}
.pill.v-doc_repetido{background:var(--a3-soft); color:var(--a3)}
.pill.v-linea_repetida{background:var(--surface-2); color:var(--muted)}
.pill.v-sincontraste{background:var(--surface-2); color:var(--muted)}
.pill.v-falso{background:var(--bilky-soft); color:var(--bilky)}

.tw{overflow-x:auto; margin:18px 0 6px; border:1px solid var(--rule); border-radius:5px; background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:650; padding:11px 12px; border-bottom:1px solid var(--rule-strong);
  background:var(--surface-2); white-space:nowrap}
td{padding:9px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n, th.n{text-align:right; font-family:var(--data); font-variant-numeric:tabular-nums; white-space:nowrap}
td.mono{font-family:var(--data); font-size:12px; white-space:nowrap}
tbody tr:hover td{background:var(--surface-2)}

.tbar{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin:22px 0 0}
input[type=search]{font-family:var(--body); font-size:13.5px; padding:8px 12px; width:250px;
  border:1px solid var(--rule-strong); border-radius:4px; background:var(--surface); color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--accent); outline-offset:1px}
.tbar button{font-family:var(--body); font-size:12.5px; font-weight:600; padding:8px 12px;
  border:1px solid var(--rule-strong); background:var(--surface); color:var(--muted);
  border-radius:4px; cursor:pointer}
.tbar button[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:#fff}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .tbar button[aria-pressed=true]{color:#0e1116} }
:root[data-theme="dark"] .tbar button[aria-pressed=true]{color:#0e1116}
.tbar button:focus-visible, th[role=button]:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tbar .count{font-size:12.5px; color:var(--muted); margin-left:auto; font-family:var(--data)}
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable[data-dir]::after{content:" \2193"; color:var(--accent)}
th.sortable[data-dir="asc"]::after{content:" \2191"}

footer{padding:34px 0 60px; color:var(--muted); font-size:12.5px}
footer p{max-width:82ch}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
@media print{
  header{background:#fff; color:#000; border-bottom:2px solid #000}
  h1,header p.lede,.eyebrow{color:#000}
  .tbar{display:none} .tw{overflow:visible; break-inside:avoid}
  section{break-inside:avoid-page}
}
{% block estilo %}{% endblock %}
</style>
</head>
<body>
{% block cuerpo %}{% endblock %}
<script id="payload" type="application/json">{{ payload|safe }}</script>
<script>
var D = JSON.parse(document.getElementById('payload').textContent);
function eur(v, d){
  d = (d === undefined) ? 2 : d;
  var neg = v < 0, s = Math.abs(v).toFixed(d), p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + p.join(',');
}
function sgn(v){ return (v > 0 ? '+' : '') + eur(v); }
function cls(v){ return v > 0 ? 'pos' : (v < 0 ? 'neg' : 'muted'); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function el(t, h){ var e = document.createElement(t); if (h !== undefined) e.innerHTML = h; return e; }
function lista(x){ return (Array.isArray(x) ? x : String(x).split(' | ')).join('  ·  '); }
{% block script %}{% endblock %}
</script>
</body>
</html>
