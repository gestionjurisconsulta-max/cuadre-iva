# Cuadre de IVA (A3 contra Bilky)  ->  127.0.0.1:8081
#
# Vhost para el nginx del sistema, el que tiene el 80 y el 443. No confundir con
# web/nginx.conf, que es el de dentro del contenedor: ese sirve la interfaz y
# hace de proxy hacia la API. Este solo pone el dominio y el TLS.
#
# Este es el fichero que corre en produccion, con el dominio de verdad. Si lo
# reaprovechas para otra instalacion, cambia auditoria.iages.es en los cuatro
# sitios donde sale: los dos server_name y las dos rutas del certificado.
#
# En Rocky / RHEL va en conf.d, que se incluye entero y solo:
#
#   cp despliegue/cuadre-iva.nginx.conf /etc/nginx/conf.d/cuadre-iva.conf
#   nginx -t && systemctl reload nginx
#
# En Ubuntu / Debian, en sites-available con el enlace en sites-enabled. Un
# fichero dejado en sites-available donde no existe esa carpeta no lo lee nadie
# y no da ningun error: el dominio simplemente no responde.
#
# El certificado se saca ANTES de instalar este fichero, porque las dos lineas
# ssl_certificate apuntan a algo que todavia no existe y nginx no arranca sin
# ello. Primero un server del 80 minimo con este server_name, y luego:
#
#   certbot certonly --nginx -d auditoria.iages.es
#
# Con SELinux en enforcing hace falta ademas, o esto da 502 con el contenedor
# perfectamente sano y un "Permission denied" en el error.log:
#
#   setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    server_name auditoria.iages.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name auditoria.iages.es;

    ssl_certificate     /etc/letsencrypt/live/auditoria.iages.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auditoria.iages.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Solo HSTS, y no el resto de cabeceras que llevan los otros vhosts del
    # servidor: el nginx de dentro del contenedor ya manda X-Content-Type-Options,
    # X-Frame-Options y Referrer-Policy en cada respuesta, y repetirlas aqui las
    # duplicaria. HSTS si va aqui, porque es lo unico que el de dentro no puede
    # saber: el TLS empieza y acaba en este nginx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Los libros de un trimestre son ~5 MB, pero se pueden subir los sueltos de
    # las 118 sociedades de una vez. Tiene que coincidir con CUADRE_MAX_SUBIDA_MB
    # y con el client_max_body_size del nginx de dentro: corta el mas pequeno de
    # los tres, y si corta este el usuario ve un error de nginx sin explicacion.
    client_max_body_size 200M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sin esto la API no sabe que la peticion llego por HTTPS, y con
        # CUADRE_COOKIE_SEGURA=1 no podria entrar nadie: el navegador descarta
        # la cookie en silencio y el fallo no dice por que.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cuadrar un trimestre grande pasa del minuto. El nginx de dentro ya da
        # 300s; aqui no hay que cortar antes que el.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;

        # Los libros suben enteros y los Excel generados bajan enteros: sin
        # bufear en disco primero, o el navegador no empieza a descargar hasta
        # que ha llegado el ultimo byte.
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
