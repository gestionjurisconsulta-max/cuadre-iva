# Cuadre de IVA - vhost para el nginx del VPS (el de fuera de docker).
#
# No confundir con web/nginx.conf, que es el de dentro del contenedor y sirve la
# interfaz y el /api/. Este solo pone el dominio y el TLS, y manda todo al 8081
# del loopback, que es donde escucha el contenedor.
#
#   sudo cp despliegue/cuadre-iva.nginx.conf /etc/nginx/sites-available/cuadre-iva
#   sudo ln -s /etc/nginx/sites-available/cuadre-iva /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cuadre.tudominio.es
#
# Cambia cuadre.tudominio.es por el dominio de verdad. certbot rellena solo el
# bloque del 443 y le añade la redireccion desde el 80.
#
# En el VPS hay mas proyectos con su propio server_name. Por eso aqui no hay
# ningun default_server ni ningun "listen 80;" a secas: un vhost que se declare
# por defecto se traga las peticiones de los demas dominios del servidor.

server {
    listen 80;
    listen [::]:80;
    server_name cuadre.tudominio.es;

    # Mientras no pases certbot, esto sirve la aplicacion por http. Con el
    # certificado ya puesto, certbot convierte este bloque en un redirect al 443.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # La API lee esta cabecera para saber si la peticion venia por https y
        # decidir sobre la cookie de sesion. Si no llega, con
        # CUADRE_COOKIE_SEGURA=1 nadie puede entrar y no se ve por que.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los libros de las 93 sociedades pueden subirse de una vez. Tiene que
        # coincidir con CUADRE_MAX_SUBIDA_MB y con el client_max_body_size del
        # nginx de dentro: corta el mas pequeno de los tres, y si corta este de
        # aqui el usuario ve un error de nginx sin explicacion.
        client_max_body_size 200M;
        client_body_timeout 300s;

        # Generar los informes de un trimestre grande pasa del minuto. El de
        # dentro ya da 300 s; este tiene que dar al menos lo mismo o cortara el
        # primero, y el cuadre se queda a medias sin decir nada.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Los Excel se mandan enteros: sin esto nginx los buferea en disco y el
        # navegador no empieza a descargar hasta que ha terminado el ultimo byte.
        proxy_buffering off;
    }
}
