# Cabeceras de seguridad. Van repetidas en cada location a proposito: en nginx,
# un add_header dentro de un bloque ANULA todos los heredados del padre, asi que
# ponerlas solo arriba haria que no llegaran donde hay otras. Es un fallo que no
# se ve: la configuracion parece correcta y las cabeceras simplemente no estan.

server {
    listen 80;
    server_name _;

    # Los libros de un trimestre son ~5 MB cada uno, pero se pueden subir los
    # sueltos de las 93 sociedades a la vez. Tiene que coincidir con
    # CUADRE_MAX_SUBIDA_MB de la API, o nginx cortaria antes de que ella opine.
    client_max_body_size 200M;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;
    gzip_min_length 1024;

    # La API va por el mismo origen que la interfaz. Asi la cookie de sesion es
    # de primera parte y no hace falta ni CORS ni pensar en SameSite=None.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generar los informes de un trimestre grande puede pasar del minuto.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Los Excel se mandan enteros: sin esto nginx los buferea en disco.
        proxy_buffering off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Los ficheros con huella en el nombre no cambian nunca: se cachean a lo bruto.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # El resto va al index: las rutas las resuelve React, no el servidor.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # El index no se cachea, o un despliegue nuevo no lo veria nadie.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
